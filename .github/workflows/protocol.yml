name: protocol

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/horizon-core/**
      - crates/horizon-world/**
      - crates/horizon-protocol/**
      - .github/workflows/protocol.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/horizon-core/**
      - crates/horizon-world/**
      - crates/horizon-protocol/**
      - .github/workflows/protocol.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Test the protocol crate
        run: cargo test --locked -p horizon-protocol
